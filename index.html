<style>

/* ---------- 共通の部品 ---------- */

/* ---------- キャラ作成 ---------- */
.editor { position: absolute; inset: 0; display: flex; pointer-events: none; }

.info-chip { position: absolute; left: 50%; transform: translateX(-50%); top: calc(92px + var(--sat)); background: rgba(29,24,70,.82); padding: 6px 16px; border-radius: 999px; font-weight: 900; font-size: 16px; white-space: nowrap; box-shadow: 0 3px 0 rgba(0,0,0,.25); }

.pad-wrap { position: absolute; left: 50%; bottom: calc(18px + var(--sab)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pad { width: 104px; height: 104px; border-radius: 50%; position: relative; pointer-events: none;
  background: radial-gradient(circle at 35% 30%, #fff, #ffe3f0 30%, #ff77b3 70%, #e63b86); box-shadow: 0 7px 0 rgba(0,0,0,.25), 0 0 0 6px rgba(255,255,255,.35); animation: padBreath 1.6s ease-in-out infinite; }

.pad-hint { font-weight: 900; font-size: 15px; background: rgba(29,24,70,.8); padding: 4px 14px; border-radius: 999px; white-space: nowrap; }
.pad-arrow { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%); width: 40px; height: 70px; pointer-events: none; animation: arrowUp 1.2s ease-in-out infinite; }
.pad-arrow::before { content: ''; position: absolute; left: 13px; top: 14px; width: 14px; height: 54px; border-radius: 7px; background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0)); }
.pad-arrow::after { content: ''; position: absolute; left: 2px; top: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 24px solid #fff; }
@keyframes arrowUp { 0% { transform: translate(-50%, 10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-50%, -26px); opacity: 0; } }
.side-hint { position: absolute; bottom: calc(40px + var(--sab)); font-weight: 900; font-size: 14px; background: rgba(29,24,70,.7); padding: 6px 12px; border-radius: 999px; opacity: .9; }
.side-hint.l { left: calc(140px + var(--sal)); }
.aim-hint { position: absolute; top: 38%; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 14px; background: rgba(29,24,70,.6); padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.speedo { position: absolute; right: calc(16px + var(--sar)); bottom: calc(18px + var(--sab)); background: rgba(29,24,70,.82); border-radius: 18px; padding: 8px 14px; font-weight: 900; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.25); }

.skip { position: absolute; right: calc(16px + var(--sar)); top: 50%; font-weight: 900; font-size: 13px; background: rgba(29,24,70,.55); padding: 6px 12px; border-radius: 999px; }
.turn-banner { position: absolute; left: 0; right: 0; bottom: calc(15% + var(--sab)); display: flex; justify-content: center; pointer-events: none; }
.turn-banner > div { display: flex; align-items: center; gap: 14px; padding: 10px 34px 10px 12px; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 900; font-size: clamp(22px, 4vmin, 32px); box-shadow: 0 7px 0 rgba(0,0,0,.25); animation: bannerIn 1.8s cubic-bezier(.2,1.4,.4,1) both; }

@keyframes bannerIn { 0% { transform: translateX(-120vw) skewX(-10deg); } 18% { transform: translateX(0) skewX(0); } 82% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(120vw); opacity: 0; } }

/* ---------- 大きな文字の演出 ---------- */
.bigtxt { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
.bigtxt .w { display: inline-block; font-weight: 900; font-size: clamp(64px, 15vmin, 150px); line-height: 1; letter-spacing: .02em; }
.bigtxt .w span { display: inline-block; animation: letterPop .7s cubic-bezier(.2,1.8,.4,1) both; }
.bigtxt .s { display: table; font-weight: 900; font-size: clamp(22px, 4.4vmin, 40px); margin: 10px auto 0; padding: 2px 22px 4px; border-radius: 999px; background: rgba(26,15,69,.55); animation: subIn .5s .35s both; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
.bigtxt.strike .w span { color: #fff36b; text-shadow: 0 4px 0 #ff9a3c, 0 8px 0 #ff4f9a, 0 13px 0 #1a0f45, 0 0 34px rgba(255,210,63,.9); }
.bigtxt.spare .w span { color: #ffffff; text-shadow: 0 4px 0 #8adcff, 0 8px 0 #4c6bff, 0 13px 0 #1a0f45, 0 0 30px rgba(76,201,255,.9); }
.bigtxt.gutter .w span { color: #b8c8ff; text-shadow: 0 4px 0 #6a7bd6, 0 9px 0 #1a0f45; animation: gutterDrop 1.1s cubic-bezier(.3,1.4,.5,1) both; }
.bigtxt.split .w span { color: #ffe0a0; text-shadow: 0 4px 0 #ff8c42, 0 9px 0 #1a0f45; animation: wobble .9s ease both; }
.bigtxt.count .w { font-size: clamp(44px, 9vmin, 90px); }
.bigtxt.count .w span { color: #fff; text-shadow: 0 4px 0 #9b6bff, 0 8px 0 #1a0f45; }
.bigtxt.perfect .w span { color: #fff36b; text-shadow: 0 5px 0 #ff4f9a, 0 10px 0 #1a0f45, 0 0 30px rgba(255,255,255,.8); }
.bigtxt.perfect .w span:nth-child(5n+2) { color: #8affd8; } .bigtxt.perfect .w span:nth-child(5n+3) { color: #9fe2ff; } .bigtxt.perfect .w span:nth-child(5n+4) { color: #d2b8ff; } .bigtxt.perfect .w span:nth-child(5n+5) { color: #ffb3d6; }
.bigtxt .burst { position: absolute; left: 50%; top: 50%; width: 140%; aspect-ratio: 1; transform: translate(-50%, -50%); z-index: -1;
  background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.22) 0 10deg, rgba(255,255,255,0) 10deg 20deg); border-radius: 50%; animation: spin 6s linear infinite, burstIn .5s ease-out both;
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%); }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes burstIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes letterPop { 0% { transform: translateY(60px) scale(.2) rotate(-20deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes subIn { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes gutterDrop { 0% { transform: translateY(-80px); opacity: 0; } 50% { transform: translateY(0); opacity: 1; } 75% { transform: translateY(0) rotate(-6deg); } 100% { transform: translateY(14px) rotate(3deg); } }
@keyframes wobble { 0% { transform: scale(.3); opacity: 0; } 40% { transform: scale(1.15) rotate(6deg); opacity: 1; } 60% { transform: rotate(-6deg); } 80% { transform: rotate(3deg); } 100% { transform: none; } }
.bigtxt.out { animation: bigOut .4s ease-in both; }
@keyframes bigOut { to { transform: translate(-50%, -60%) scale(1.3); opacity: 0; } }

/* ---------- スタンプ ---------- */
.stamp-btns { position: absolute; right: calc(14px + var(--sar)); bottom: calc(130px + var(--sab)); display: grid; grid-template-columns: repeat(2, 58px); gap: 8px; pointer-events: auto; }
.stamp-btns button { width: 58px; height: 58px; border-radius: 18px; border: none; background: #fff; font-size: 13px; font-weight: 900; font-family: var(--font); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.2); line-height: 1.1; }
.stamp-btns button .e { font-size: 24px; display: block; }
.stamp-fly { position: absolute; display: flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 16px 6px 6px; font-weight: 900; font-size: 18px; box-shadow: 0 5px 0 rgba(0,0,0,.2);
  animation: stampFly 2.6s ease-out both; }
.stamp-fly img { width: 40px; height: 40px; border-radius: 50%; }
.stamp-fly .e { font-size: 30px; }
@keyframes stampFly { 0% { transform: translateY(40px) scale(.4); opacity: 0; } 12% { transform: translateY(0) scale(1.1); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; transform: translateY(-30px); } 100% { opacity: 0; transform: translateY(-60px); } }

/* ---------- トースト・モーダル ---------- */
.toast { background: #fff; color: var(--ink); font-weight: 900; padding: 10px 20px; border-radius: 999px; box-shadow: 0 5px 0 rgba(0,0,0,.2); animation: toastIn .3s ease-out both; max-width: 90vw; text-align: center; font-size: 15px; }
.toast.err { background: #ffe1ec; color: #c21d63; }
.toast.out { animation: toastOut .3s ease-in both; }
@keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(-20px); opacity: 0; } }
.modal-card { width: min(560px, 92vw); max-height: 90vh; overflow-y: auto; touch-action: pan-y; background: #fff; color: var(--ink); border-radius: 28px; padding: 22px; box-shadow: 0 8px 0 rgba(0,0,0,.25); animation: modalIn .35s cubic-bezier(.2,1.5,.4,1) both; }
.modal-card h3 { margin: 0 0 10px; font-size: 22px; font-weight: 900; text-align: center; }
.modal-card p { font-weight: 700; line-height: 1.7; margin: 8px 0; }
@keyframes modalIn { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.fb-steps { margin: 8px 0; padding-left: 0; list-style: none; counter-reset: fbs; font-size: 14px; font-weight: 700; line-height: 1.6; }
.fb-step { position: relative; padding: 8px 10px 8px 44px; margin: 6px 0; border-radius: 14px; background: #f5f2ff; counter-increment: fbs; }
.fb-step::before { content: counter(fbs); position: absolute; left: 10px; top: 8px; width: 24px; height: 24px; border-radius: 50%; background: #9b6bff; color: #fff; font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.fb-step.done { background: #e4fbf3; }
.fb-step.done::before { content: '✓'; background: #1fa77a; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #fff; padding: 1px 5px; border-radius: 6px; }
.fb-rules { width: 100%; height: 92px; box-sizing: border-box; border: 2px solid #ddd5ff; border-radius: 12px; padding: 8px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #3a3060; background: #fff; resize: vertical; -webkit-user-select: text; user-select: text; touch-action: auto; }

/* ---------- チュートリアル ---------- */
.tut { position: absolute; inset: 0; pointer-events: auto; background: rgba(15,10,40,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
.tut-card { width: min(520px, 90vw); background: #fff; color: var(--ink); border-radius: 30px; padding: 22px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.25); animation: modalIn .35s cubic-bezier(.2,1.5,.4,1) both; }
.tut-card h3 { margin: 0 0 6px; font-size: 24px; font-weight: 900; }
.tut-card p { font-weight: 800; line-height: 1.7; margin: 6px 0 12px; }
.tut-anim { height: 150px; position: relative; background: linear-gradient(180deg, #2b2370, #4a3aa8); border-radius: 22px; margin: 8px 0 12px; overflow: hidden; }
.tut-anim .lane { position: absolute; left: 50%; top: 0; bottom: 0; width: 90px; transform: translateX(-50%); background: linear-gradient(180deg, #f3d6a8, #e9c28b); }
.tut-anim .finger { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(255,255,255,.95); border: 4px solid var(--pink); box-shadow: 0 0 0 6px rgba(255,79,154,.3); }
.tut-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.tut-dots i { width: 10px; height: 10px; border-radius: 50%; background: #ddd6f5; }
.tut-dots i.on { background: var(--pink); }
@keyframes fMove { 0%,100% { left: 30%; } 50% { left: 70%; } }
@keyframes fAim { 0% { left: 50%; top: 70%; } 50% { left: 40%; top: 20%; } 100% { left: 58%; top: 20%; } }
@keyframes fSwipe { 0% { left: 50%; top: 85%; opacity: 0; } 15% { opacity: 1; } 70% { left: 50%; top: 15%; opacity: 1; } 100% { left: 50%; top: 10%; opacity: 0; } }
@keyframes fCurve { 0% { left: 52%; top: 85%; opacity: 0; } 12% { opacity: 1; } 55% { left: 52%; top: 38%; } 80% { left: 36%; top: 12%; opacity: 1; } 100% { opacity: 0; left: 30%; top: 8%; } }

/* ---------- リザルト ---------- */
.result { width: min(860px, 100%); margin: auto 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
/* 結果：横画面は右に表（左に表彰台が見える）、縦画面は下に表（上に表彰台） */
.screen.result-screen { justify-content: center; align-items: flex-end; background: linear-gradient(90deg, rgba(20,14,60,0) 0%, rgba(20,14,60,.08) 38%, rgba(20,14,60,.55) 62%, rgba(20,14,60,.7) 100%); }
.result-screen .result { width: min(600px, 54vw); }
@media (orientation: portrait) {
  .screen.result-screen { align-items: center; background: linear-gradient(180deg, rgba(20,14,60,0) 0%, rgba(20,14,60,.06) 36%, rgba(20,14,60,.6) 58%, rgba(20,14,60,.72) 100%); }
  .result-screen .result { width: 100%; margin: auto 0 0; }
}
.res-title { font-weight: 900; font-size: clamp(34px, 7vmin, 60px); color: #ffe14a; text-shadow: 0 3px 0 #ff8c42, 0 6px 0 #1a0f45, 0 0 24px rgba(255,79,154,.5); animation: logoIn .8s cubic-bezier(.2,1.6,.4,1) both; }
.res-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.res-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.96); color: var(--ink); border-radius: 22px; padding: 8px 14px 8px 8px; box-shadow: 0 5px 0 rgba(0,0,0,.2); animation: rowIn .5s cubic-bezier(.2,1.4,.4,1) both; flex-wrap: wrap; }
.res-row .rk-no { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; background: #efeafc; color: #6a5d9c; flex: none; }
.res-row.p1 .rk-no { background: var(--yellow); color: var(--ink); }
.res-row.p2 .rk-no { background: #d8dee9; } .res-row.p3 .rk-no { background: #f2c39b; }
.res-row img { width: 50px; height: 50px; border-radius: 50%; flex: none; }
.res-row .nm { font-weight: 900; font-size: 20px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-row .st { font-size: 12px; font-weight: 800; color: #7a6db0; }
.res-row .sc { font-weight: 900; font-size: 36px; color: var(--pink); }
.btn.tiny { padding: 5px 14px; font-size: 13px; margin-top: 5px; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.res-row .st { line-height: 1.5; }
@keyframes rowIn { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
.res-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.new-best { display: inline-block; background: var(--pink); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; animation: pulse 1s infinite; }

/* ---------- 縦画面 ---------- */
@media (max-aspect-ratio: 1/1) {
  .plist { top: auto; bottom: calc(150px + var(--sab)); }
  .side-hint.l { left: calc(14px + var(--sal)); bottom: calc(130px + var(--sab)); }
  .info-chip { top: calc(96px + var(--sat)); }
}
@media (max-width: 700px) {
  .sheet .who { display: none; }
  .fr { width: 26px; } .fr:last-child { width: 40px; }
  .total { min-width: 44px; }
}

<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="touch"></div>
  <div id="hud" class="hidden"></div>
  <div id="screens"></div>
  <div id="pop"></div>
  <div id="stamps"></div>
  <div id="toast"></div>
  <div id="modal" class="hidden"></div>
  <div id="loading">
    <div class="ld-logo"><span class="ld-pin"></span><span class="ld-ball"></span></div>
    <div class="ld-text">よみこみ中…</div>
    <div class="ld-err"></div>
  </div>
</div>
<script>
// 読み込みに失敗したとき（インターネットにつながっていない など）
window.addEventListener('error', function (e) {
  var el = document.querySelector('#loading .ld-err');
  if (el && document.getElementById('loading').style.display !== 'none' && /Failed to fetch|import|module|Load failed|Importing/i.test(String(e.message || ''))) {
    el.textContent = 'ゲームの部品を読みこめませんでした。インターネットにつながっているか確認して、ページを開き直してください。';
  }
});
setTimeout(function () {
  var l = document.getElementById('loading');
  var el = document.querySelector('#loading .ld-err');
  if (l && l.style.display !== 'none' && el && !el.textContent) el.textContent = '時間がかかっています…（インターネット接続を確認してください）';
}, 20000);
